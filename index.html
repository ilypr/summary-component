<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Results summary component</title>
    <!--Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="results-styling.css" />
  </head>
  <body>
    <main>
      <div class="Big-container">
        <section>
          <div class="purple-container-parent">
            <div class="purple-container-styling">
              <h1>Your Result</h1>
              <div class="circle">
                <h2>76</h2>
                <p>of 100</p>
              </div>
              <h3>Great</h3>
              <p class="result-description">
                You scored higher than 65% of the people who have taken these
                tests.
              </p>
            </div>
          </div>
        </section>
        <section class="grow">
          <div class="summary-container">
            <h4>Summary</h4>
            <ul>
              <li class="parameters"><span class="reaction">Reaction</span><span>80 / 100</span></li>
              <li class="parameters"><span class="memory">Memory</span><span>92 / 100</span></li>
              <li class="parameters"><span class="verbal">Verbal</span><span>61 / 100</span></li>
              <li class="parameters"><span class="visual">Visual</span><span>73 / 100</span></li>
            </ul>
            <div class="continue-button">
              <a link="#">Continue</a>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <div class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="https://github.com/ilypr">Ilypr</a>.
      </div>
    </footer>
  </body>
</html>
